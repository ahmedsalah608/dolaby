@font-face{font-family:"Readex Pro";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/readex-pro-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  --bg:#f3f4f7; --card:#ffffff; --fill:#eaedf3; --line:#e0e4ec; --ink:#131b31; --sub:#646e88;
  --brand:#172442; --on-brand:#ffffff; --gold:#c4942b; --gold-soft:#f6ebd0; --gold-ink:#5a3f06;
  --good:#24774a; --good-soft:#ddf0e4; --warn:#9a5a00; --warn-soft:#f8e8cf; --bad:#a63434; --bad-soft:#f7dddd;
  --scrim:rgba(12,18,34,.5);
  --sum:#dcedf8; --sum-ink:#1d5c82; --win:#f5e1cd; --win-ink:#7a3d10;
  --font:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1220; --card:#161d30; --fill:#1f2740; --line:#273049; --ink:#eceff6; --sub:#9aa3bb;
  --brand:#e2b450; --on-brand:#1a1305; --gold:#e2b450; --gold-soft:#372c14; --gold-ink:#f1d48e;
  --good:#66c793; --good-soft:#163325; --warn:#eaa64a; --warn-soft:#3a2a12; --bad:#e87d7d; --bad-soft:#3d1e1e;
  --scrim:rgba(0,0,0,.62); --sum:#16304a; --sum-ink:#93c8ee; --win:#3a2414; --win-ink:#f0b98a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0d1220; --card:#161d30; --fill:#1f2740; --line:#273049; --ink:#eceff6; --sub:#9aa3bb;
  --brand:#e2b450; --on-brand:#1a1305; --gold:#e2b450; --gold-soft:#372c14; --gold-ink:#f1d48e;
  --good:#66c793; --good-soft:#163325; --warn:#eaa64a; --warn-soft:#3a2a12; --bad:#e87d7d; --bad-soft:#3d1e1e;
  --scrim:rgba(0,0,0,.62); --sum:#16304a; --sum-ink:#93c8ee; --win:#3a2414; --win-ink:#f0b98a; color-scheme:dark }
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:20px calc(110px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:26px;font-weight:700} h2{font-size:21px;font-weight:600} h3{font-size:17px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sub{color:var(--sub)} .sm{font-size:14px} .xs{font-size:13px}
.col{display:flex;flex-direction:column;gap:14px}
.col.lg{gap:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.ic{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* buttons */
.btn{appearance:none;border:0;border-radius:14px;min-height:52px;padding:0 20px;font-weight:600;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--fill);color:var(--ink)}
.btn.main{background:var(--brand);color:var(--on-brand)}
.btn.wide{width:100%}
.btn.text{background:transparent;min-height:44px;padding:0 8px;color:var(--sub);font-weight:500}
.btn.red{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{appearance:none;border:0;background:var(--fill);width:44px;height:44px;border-radius:999px;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}

/* tape strip — the signature element */
.tape{position:relative;height:30px;border-radius:8px;background:var(--gold-soft);overflow:hidden}
.tape::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to left,var(--gold) 0 1.5px,transparent 1.5px 10px) top/100% 8px no-repeat,repeating-linear-gradient(to left,var(--gold) 0 1.5px,transparent 1.5px 50px) top/100% 15px no-repeat;opacity:.55}
.tape i{position:absolute;inset-block:0;right:0;background:var(--gold);opacity:.9;border-radius:8px;transition:width .35s ease}
.tape b{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;font-size:12px;font-weight:600;color:var(--gold-ink);font-variant-numeric:tabular-nums}

/* home */
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hello .sub{font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;font-weight:500}
.s-keep{background:var(--good-soft);color:var(--good)} .s-tailor{background:var(--warn-soft);color:var(--warn)} .s-remove{background:var(--bad-soft);color:var(--bad)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:14px;padding:4px;gap:4px}
.seg button{appearance:none;border:0;background:transparent;border-radius:10px;min-height:42px;font-weight:500;cursor:pointer;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.piece{appearance:none;border:0;background:var(--card);border-radius:18px;padding:0;overflow:hidden;cursor:pointer;text-align:start;display:flex;flex-direction:column}
.piece .ph{aspect-ratio:4/5;max-width:100%;background:var(--fill);display:grid;place-items:center;position:relative;color:var(--sub)}
.piece .ph img{width:100%;height:100%;object-fit:cover}
.piece .ph .ic{width:44px;height:44px;stroke-width:1.3}
.piece .tag{position:absolute;top:8px;right:8px}
.piece .nm{padding:10px 12px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.piece .nm strong{font-size:15px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.piece .nm span{font-size:13px;color:var(--sub)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.p-keep{background:var(--good-soft);color:var(--good)} .p-tailor{background:var(--warn-soft);color:var(--warn)} .p-remove{background:var(--bad-soft);color:var(--bad)} .p-none{background:var(--card);color:var(--sub)} .p-gold{background:var(--gold-soft);color:var(--gold-ink)} .p-mute{background:var(--fill);color:var(--sub)}
.hero-empty{background:var(--card);border-radius:22px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.hero-empty .ic{width:56px;height:56px;color:var(--gold);stroke-width:1.3}

/* perfume shelf */
.plist{background:var(--card);border-radius:18px;overflow:hidden}
.prow{appearance:none;border:0;background:transparent;width:100%;display:flex;align-items:center;gap:14px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;text-align:start}
.prow:last-child{border-bottom:0}
.pthumb{width:58px;height:58px;border-radius:14px;overflow:hidden;flex:none;display:grid}
.pthumb img{width:100%;height:100%;object-fit:cover}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pinfo strong{font-size:15px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.pinfo small{font-size:13px;color:var(--sub)}
.mono{display:grid;place-items:center;width:100%;height:100%;font-weight:700;font-size:20px;letter-spacing:0}
.mono.big{width:110px;height:110px;border-radius:26px;font-size:40px}
.m-sum{background:var(--sum);color:var(--sum-ink)} .m-win{background:var(--win);color:var(--win-ink)} .m-all{background:var(--gold-soft);color:var(--gold-ink)}

/* advisor chat */
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:86%;border-radius:18px;padding:10px 14px;font-size:15px;line-height:1.65;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:6px}
.bub img{border-radius:12px;max-height:240px;object-fit:cover}
.bub.me{align-self:flex-end;background:var(--brand);color:var(--on-brand);border-end-end-radius:6px}
.bub.him{align-self:flex-start;background:var(--card);border-end-start-radius:6px}
.bub a{color:var(--gold);font-weight:500}
.composer{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:10px 4px;display:flex;flex-direction:column;gap:6px;z-index:3}

/* tab bar */
nav.tabbar{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav.tabbar button{appearance:none;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--sub);min-height:50px;justify-content:center}
nav.tabbar button[aria-current="true"]{color:var(--ink);font-weight:600}
nav.tabbar .plus{width:56px;height:56px;border-radius:999px;background:var(--brand);color:var(--on-brand);margin:-22px auto 0;box-shadow:0 6px 16px rgba(0,0,0,.2)}
nav.tabbar .plus .ic{width:28px;height:28px;stroke-width:2.2}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;height:94%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px))}
.sheet-top h2{font-size:18px;text-align:center;flex:1}
.sheet-body{flex:1;overflow-y:auto;padding:6px max(18px,env(safe-area-inset-right,0px)) 20px max(18px,env(safe-area-inset-left,0px))}
.sheet-foot{padding:12px max(18px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:8px}

/* wizard */
.wiz{min-height:calc(100vh - 60px);display:flex;flex-direction:column;gap:22px}
.wiz-body{flex:1;display:flex;flex-direction:column;gap:18px}
.wiz-foot{display:flex;flex-direction:column;gap:8px;position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(8px + env(safe-area-inset-bottom,0px))}
.lead{font-size:17px;color:var(--sub)}

/* fields */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:15px;font-weight:500}
.field small{font-size:13px;color:var(--sub)}
.field input,.field textarea,.field select{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;min-height:52px;font-size:17px}
.field input:focus,.field textarea:focus{border-color:var(--gold);outline:none}
.field textarea{min-height:90px;resize:vertical;line-height:1.5}
.unitbox{position:relative}
.unitbox input{padding-inline-end:64px;font-variant-numeric:tabular-nums}
.unitbox em{position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);font-style:normal;font-size:14px;color:var(--sub);pointer-events:none}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
details.more{background:var(--card);border-radius:16px;padding:0 16px}
details.more summary{list-style:none;cursor:pointer;min-height:54px;display:flex;align-items:center;justify-content:space-between;font-weight:600}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font-size:22px;color:var(--sub);font-weight:400}
details.more[open] summary::after{content:"−"}
details.more>div{padding-bottom:16px;display:flex;flex-direction:column;gap:14px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{appearance:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:15px}
.choice[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--on-brand)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{appearance:none;border:1.5px solid transparent;background:var(--card);border-radius:18px;min-height:112px;padding:16px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;text-align:start;font-weight:600;font-size:16px}
.tile .ic{width:34px;height:34px;color:var(--gold);stroke-width:1.5}
.shots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.shot{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:18px;background:var(--card);border:1.5px dashed var(--line);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:10px;color:var(--sub);font-size:14px;font-weight:500}
.shot .ic{width:30px;height:30px;stroke-width:1.5}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot.done{border-style:solid;border-color:var(--gold)}
.shot.done .lbl{position:absolute;bottom:8px;inset-inline:8px;background:var(--scrim);color:#fff;border-radius:10px;padding:3px 8px;font-size:13px}
.shot.done .ok{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:999px;background:var(--gold);color:var(--on-brand);display:grid;place-items:center}
.shot.done .ok .ic{width:16px;height:16px;stroke-width:3;color:#fff}
.shot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.tip{background:var(--gold-soft);color:var(--gold-ink);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.55}

/* detail */
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:calc(-1 * max(18px,env(safe-area-inset-right,0px)));padding-inline:max(18px,env(safe-area-inset-right,0px));scrollbar-width:none}
.strip figure{margin:0;flex:0 0 72%;scroll-snap-align:center;display:flex;flex-direction:column;gap:4px}
.strip img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:18px;background:var(--fill)}
.strip figcaption{font-size:13px;color:var(--sub);text-align:center}
.verdict{border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px}
.verdict .big{font-size:28px;font-weight:700;line-height:1.2}
.v-keep{background:var(--good-soft)} .v-keep .big{color:var(--good)}
.v-tailor{background:var(--warn-soft)} .v-tailor .big{color:var(--warn)}
.v-remove{background:var(--bad-soft)} .v-remove .big{color:var(--bad)}
.box{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.box ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.fix{display:flex;flex-direction:column;gap:4px;padding-block:10px;border-top:1px solid var(--line)}
.fix:first-of-type{border-top:0;padding-top:0}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:15px}
.facts dt{color:var(--sub)} .facts dd{margin:0;overflow-wrap:anywhere}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.actions .btn{flex-direction:column;gap:4px;min-height:72px;font-size:13px;font-weight:500;padding:8px}

/* profile list */
.list{background:var(--card);border-radius:18px;overflow:hidden}
.li{appearance:none;border:0;background:transparent;width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:start;cursor:pointer;border-bottom:1px solid var(--line);min-height:62px}
.li:last-child{border-bottom:0}
.li .ic{color:var(--gold)}
.li div{flex:1;min-width:0;display:flex;flex-direction:column}
.li small{color:var(--sub);font-size:13px}
.li .chev{color:var(--sub);transform:scaleX(-1)}
.table-wrap{overflow-x:auto;background:var(--card);border-radius:16px}
table{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;width:100%}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:start}
th{color:var(--sub);font-weight:500}
tr:last-child td{border-bottom:0}
.steps{display:flex;flex-direction:column;gap:0;background:var(--card);border-radius:18px;padding:6px 16px}
